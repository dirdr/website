[package]
name = "portfolio-mnist"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nn_lib = { git = "https://github.com/AlexVplle/nn_lib.git", rev = "b57ac76b2306b9ec418e0cc4ddbb62cfc8fa846f" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
serde_json = "1.0"
cubecl-common = { version = "0.8.1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
