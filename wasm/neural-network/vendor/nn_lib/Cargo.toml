[package]
name = "nn_lib"
version = "0.1.0"
edition = "2021"
authors = ["Adrien Pelfresne", "Alexis Vapaille"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
log = "0.4.21"
ndarray = "0.15.6"
ndarray-stats = "0.5.1"
ndarray-rand = "0.14.0"
num-traits = "0.2.19"
thiserror = "1.0.60"
rand = "0.8.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndarray = { version = "0.15.6", features = ["matrixmultiply-threading", "rayon"] }
